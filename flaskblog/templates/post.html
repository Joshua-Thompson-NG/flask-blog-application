{% extends "base.html" %}
{% block content %}
    <article class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm p-6">

        <div class="flex items-center justify-between pb-4 mb-4 border-b border-gray-200 dark:border-gray-700">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ post.title }}</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                    by {{ post.author.username }} &middot; {{ post.date_posted.strftime('%B %d, %Y') }}
                </p>
            </div>

            {% if post.author == current_user %}
                <div class="flex items-center gap-2 flex-shrink-0">
                    <a href="{{ url_for('update_post', post_id=post.id) }}"
                       class="px-3 py-1.5 rounded-md border border-gray-300 dark:border-gray-600 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                        Update
                    </a>
                    <button type="button" data-toggle="modal" data-target="#deleteModal"
                            class="px-3 py-1.5 rounded-md bg-red-600 text-white text-sm font-medium hover:bg-red-700 transition-colors">
                        Delete
                    </button>
                </div>
            {% endif %}
        </div>

        <div class="prose dark:prose-invert max-w-none text-gray-700 dark:text-gray-300">
            {{ post.content }}
        </div>
    </article>
{% endblock %}
