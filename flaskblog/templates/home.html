{% extends "base.html" %}
{% block content %}
<div class="space-y-8">
    {% for i in posts %}
    <article class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow duration-200">
        <div class="flex flex-col gap-3">

            <!-- Metadata: Avatar, Name and Muted Date -->
            <div class="flex items-center gap-3 text-sm">
                <img src="{{ url_for('static', filename='pics/' + i.author.image_file) }}"
                     alt="{{ i.author.username }}"
                     class="w-9 h-9 rounded-full object-cover border border-gray-200 dark:border-gray-600">

                <div class="flex items-center gap-2">
                    <a href="" class="font-semibold text-gray-700 dark:text-gray-200 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
                        {{ i.author.username }}
                    </a>
                    <span class="text-gray-400 dark:text-gray-500">•</span>
                    <time datetime="{{ i.date_posted.strftime('%Y-%m-%dT%H:%M:%S') }}" class="text-gray-400 dark:text-gray-500">
                        {{ i.date_posted.strftime('%B %d, %Y at %I:%M %p') }}
                    </time>
                </div>
            </div>

            <!-- Horizontal Divider Line -->
            <hr class="border-gray-200 dark:border-gray-700 my-1">

            <!-- Blog Post Title -->
            <h2 class="text-xl sm:text-2xl font-bold tracking-tight text-gray-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
                <a href="{{ url_for('post',post_id=i.id) }}">{{ i.title }}</a>
            </h2>

            <!-- Content Preview -->
            <p class="text-gray-600 dark:text-gray-300 line-clamp-4 leading-relaxed">
                {{ i.content }}
            </p>

        </div>
    </article>
    {% endfor %}
</div>
{% endblock %}
